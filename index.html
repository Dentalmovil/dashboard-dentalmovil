<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentalmovilr4 | Hub Cripto & DePIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <header class="p-6 border-b border-gray-800 flex justify-between items-center bg-black">
        <h1 class="text-2xl font-black text-yellow-500 tracking-tighter">DENTALMOVILR4</h1>
        <div class="text-xs bg-green-900 text-green-400 px-3 py-1 rounded-full animate-pulse font-mono">NODO ACTIVO</div>
    </header>

    <main class="p-4 space-y-6 max-w-lg mx-auto">
        
        <section class="bg-gradient-to-br from-green-800 to-gray-900 p-6 rounded-2xl shadow-2xl border border-green-500/30">
            <div class="flex items-center mb-4">
                <div class="bg-green-500 p-2 rounded-lg mr-3">
                    <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h3 class="text-xl font-bold">Minería DePIN (3x)</h3>
            </div>
            <p class="text-gray-300 text-sm mb-6">Únete a mi red y gana cripto usando solo tu internet sobrante. Sin gastar batería.</p>
            
            <a href="https://app.grass.io/register/?referralCode=hT-gXzZxbuOvn37" 
               target="_blank" 
               class="block w-full text-center bg-green-500 hover:bg-green-400 text-black font-extrabold py-3 px-4 rounded-xl transition duration-300 transform hover:scale-105 shadow-lg">
               ¡EMPEZAR A MINAR GRATIS!
            </a>
        </section>

        <section class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h3 class="text-gray-400 uppercase text-xs font-bold tracking-widest mb-4">Estatus del Mercado</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-xs text-gray-500">BTC/USDT</p>
                    <p id="btc" class="text-lg font-mono text-yellow-500 font-bold">Cargando...</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500">ETH/USDT</p>
                    <p id="eth" class="text-lg font-mono text-blue-400 font-bold">Cargando...</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        async function updateMarket() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT"]');
                const data = await res.json();
                document.getElementById('btc').innerText = `$${Math.round(data[0].price).toLocaleString()}`;
                document.getElementById('eth').innerText = `$${Math.round(data[1].price).toLocaleString()}`;
            } catch (e) { console.log("Reconectando..."); }
        }
        setInterval(updateMarket, 15000);
        updateMarket();
    </script>
</body>
</html>
