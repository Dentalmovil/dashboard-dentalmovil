<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentalmovilr4 | Crypto Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <header class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-yellow-500">DENTALMOVILR4</h1>
        <div id="status" class="text-xs bg-green-900 text-green-400 px-3 py-1 rounded-full">Sistema Activo</div>
    </header>

    <main class="p-4 space-y-6">
        <section class="grid grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded-xl shadow-lg border-l-4 border-yellow-500">
                <p class="text-gray-400 text-sm">Bitcoin (BTC)</p>
                <h2 id="btc-price" class="text-xl font-mono">Cargando...</h2>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl shadow-lg border-l-4 border-blue-500">
                <p class="text-gray-400 text-sm">Ethereum (ETH)</p>
                <h2 id="eth-price" class="text-xl font-mono">Cargando...</h2>
            </div>
        </section>

        <section class="bg-gray-800 p-6 rounded-xl shadow-lg">
            <h3 class="text-lg font-semibold mb-4 text-gray-300">Resumen de Cuenta (Binance)</h3>
            <div class="flex justify-between items-center">
                <span class="text-gray-400">Balance Estimado:</span>
                <span id="balance" class="text-2xl text-green-400 font-bold">$0.00</span>
            </div>
            <p class="text-[10px] text-gray-500 mt-4 italic">* Los datos se sincronizan vía API de solo lectura.</p>
        </section>
    </main>

    <script>
        // Función para obtener precios reales sin gastar batería
        async function fetchPrices() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT"]');
                const data = await response.json();
                
                document.getElementById('btc-price').innerText = `$${parseFloat(data[0].price).toLocaleString()}`;
                document.getElementById('eth-price').innerText = `$${parseFloat(data[1].price).toLocaleString()}`;
            } catch (error) {
                console.error("Error al conectar con Binance", error);
            }
        }

        // Ejecutar al cargar
        setInterval(fetchPrices, 30000); // Actualiza cada 30 segundos para ahorrar datos
        fetchPrices();
    </script>
</body>
</html>
